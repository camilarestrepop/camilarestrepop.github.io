# This file only tells Python where the website builder lives. Nothing here needs changing.
# (Este archivo solo le dice a Python donde esta el programa. No hay que cambiar nada aqui.)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinco-tintas"
version = "1.0.0"
description = "The 5 Tintas website"
requires-python = ">=3.13"
dependencies = [
    "Jinja2>=3.1.6",
    "MarkupSafe>=3.0.3",
    "pillow>=12.0",
    "pillow-heif>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]
